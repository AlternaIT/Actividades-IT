<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alterna — Acceso</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{background:#fff;padding:2.5rem 2rem;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.08);width:100%;max-width:380px}
    .logo{font-size:1.5rem;font-weight:700;color:#6366f1;margin-bottom:.25rem}
    h1{font-size:1.15rem;color:#1a1a2e;margin-bottom:.25rem}
    p{font-size:.85rem;color:#6b7280;margin-bottom:1.75rem}
    label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:.35rem}
    input{width:100%;padding:.65rem .85rem;border:1px solid #d1d5db;border-radius:8px;font-size:.9rem;margin-bottom:1rem;outline:none;transition:border-color .2s}
    input:focus{border-color:#6366f1}
    button{width:100%;padding:.7rem;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .2s}
    button:hover{background:#4f46e5}
    button:disabled{background:#a5b4fc;cursor:not-allowed}
    .msg{display:none;padding:.6rem .85rem;border-radius:8px;font-size:.82rem;margin-bottom:1rem}
    .msg.error{background:#fee2e2;color:#b91c1c}
    .msg.info{background:#e0e7ff;color:#3730a3}
    .msg.visible{display:block}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Alterna</div>
  <h1>Iniciar sesión</h1>
  <p>Ingresa tu correo @alterna.pro para recibir un código de acceso.</p>
  <div class="msg" id="msg"></div>
  <label for="email">Correo electrónico</label>
  <input type="email" id="email" placeholder="tu@alterna.pro" autocomplete="email"/>
  <button id="btnEnviar">Enviar código</button>
</div>
<script>
  const supabase = window.supabase.createClient(
    'https://lbxdzsfnuvylrdcrlhjz.supabase.co',
    'sb_publishable_aEEtnleb_NbPYaEgjwENmw_7cWxZHqk',
    { auth: { persistSession: true } }
  );

  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = 'panel.html';
  })();

  document.getElementById('btnEnviar').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const msg   = document.getElementById('msg');
    const btn   = document.getElementById('btnEnviar');
    msg.className = 'msg';

    if (!email.endsWith('@alterna.pro')) {
      msg.textContent = 'Solo se permiten correos @alterna.pro.';
      msg.classList.add('error','visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enviando...';

    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: true }
    });

    btn.disabled = false;
    btn.textContent = 'Enviar código';

    if (error) {
      msg.textContent = 'Error al enviar el código. Intenta nuevamente.';
      msg.classList.add('error','visible');
      return;
    }

    sessionStorage.setItem('otp_email', email);
    window.location.href = 'verify.html';
  });
</script>
</body>
</html>
