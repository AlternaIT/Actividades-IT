    <p class="muted login-sub">Control de actividades y proyectos</p>
    <form id="loginForm">
      <label>Correo
        <input id="email" type="email" required autocomplete="email" placeholder="correo@empresa.com">
      </label>
      <label>Contraseña
        <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button class="primary" type="submit">Iniciar sesión</button>
      <p id="error" class="error"></p>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const btn = form.querySelector('button');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      btn.disabled = true; btn.textContent = 'Entrando…';
      const { error: authError } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });
      if (authError) { error.textContent = authError.message; btn.disabled = false; btn.textContent = 'Iniciar sesión'; return; }
      location.href = 'dashboard.html';
    });
  </script>
