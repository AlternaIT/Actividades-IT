<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión TI — Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- MODAL EDITAR -->
  <div id="editModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-head"><h3>Editar actividad</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <form id="editForm" class="form-grid">
        <input type="hidden" id="editId">
        <label>Actividad<input id="eTitle" required></label>
        <label>Proyecto<input id="eProject"></label>
        <label>Área<input id="eArea"></label>
        <label>Asignado<input id="eAssigned"></label>
        <label>Importancia<select id="eImportance"><option>Baja</option><option>Media</option><option>Alta</option></select></label>
        <label>Prioridad<select id="ePriority"><option>Baja</option><option>Media</option><option>Alta</option></select></label>
        <label>Estado<select id="eStatus"><option>No iniciado</option><option>En proceso</option><option>Terminado</option></select></label>
        <label>Fecha de entrega<input id="eDue" type="date"></label>
        <label class="wide">Notas<textarea id="eNotes"></textarea></label>
        <button class="primary wide" type="submit">Guardar cambios</button>
        <p id="editMsg" class="muted wide"></p>
      </form>
    </div>
  </div>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Dashboard</h1>
        <p class="muted" id="welcome">Cargando...</p>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn-outline" onclick="exportCSV()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar CSV
        </button>
        <a href="#nueva" class="primary btn-new">+ Nueva actividad</a>
      </div>
    </header>

    <section class="cards">
      <article class="stat"><span>Total</span><strong id="total">0</strong></article>
      <article class="stat"><span>En proceso</span><strong id="progress">0</strong></article>
      <article class="stat"><span>No iniciadas</span><strong id="pending">0</strong></article>
      <article class="stat"><span>Terminadas</span><strong id="done">0</strong></article>
      <article class="stat danger"><span>Vencidas</span><strong id="overdue">0</strong></article>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="panel-head"><h2>Por estado</h2></div>
        <div id="statusBars"></div>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>Por prioridad</h2></div>
        <div id="priorityBars"></div>
      </article>
    </section>

    <section class="panel" id="actividades">
      <div class="panel-head">
        <h2>Actividades</h2>
        <div class="filters">
          <input id="search" class="search" placeholder="Buscar…">
          <select id="filterStatus" class="search" style="width:auto">
            <option value="">Estado</option>
            <option>No iniciado</option>
            <option>En proceso</option>
            <option>Terminado</option>
          </select>
          <select id="filterPriority" class="search" style="width:auto">
            <option value="">Prioridad</option>
            <option>Baja</option>
            <option>Media</option>
            <option>Alta</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Actividad</th><th>Proyecto</th><th>Prioridad</th><th>Estado</th><th>Entrega</th><th>Asignado</th><th></th>
          </tr></thead>
          <tbody id="activityTable"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="nueva">
      <div class="panel-head"><h2>Nueva actividad</h2></div>
      <form id="activityForm" class="form-grid">
        <label>Actividad<input id="activityTitle" required></label>
        <label>Proyecto<input id="project" placeholder="Ej. Gestión TI"></label>
        <label>Área<input id="area" placeholder="Ej. TI"></label>
        <label>Asignado<input id="assigned" placeholder="Nombre"></label>
        <label>Importancia<select id="importance"><option>Baja</option><option selected>Media</option><option>Alta</option></select></label>
        <label>Prioridad<select id="priority"><option>Baja</option><option selected>Media</option><option>Alta</option></select></label>
        <label>Estado<select id="status"><option>No iniciado</option><option>En proceso</option><option>Terminado</option></select></label>
        <label>Fecha de entrega<input id="due" type="date"></label>
        <label class="wide">Notas<textarea id="notes"></textarea></label>
        <button class="primary wide" type="submit">Guardar actividad</button>
        <p id="formMsg" class="muted wide"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let activities = [];

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      const { data: profile } = await supabaseClient
        .from('profiles').select('full_name,role').eq('id', session.user.id).maybeSingle();
      document.getElementById('welcome').textContent =
        `${profile?.full_name || session.user.email} · ${profile?.role || 'user'}`;
      await loadActivities();
    }

    async function loadActivities() {
      const { data, error } = await supabaseClient
        .from('activities')
        .select('id,title,importance,priority,status,due_date,assigned_to,notes,projects(name),areas(name)')
        .order('due_date', { ascending: true, nullsFirst: false });
      if (error) { alert(error.message); return; }
      activities = data || [];
      render();
    }

    function render() {
      const today = new Date().toISOString().slice(0,10);
      const total = activities.length;
      const progress = activities.filter(a => a.status === 'En proceso').length;
      const pending = activities.filter(a => a.status === 'No iniciado').length;
      const done = activities.filter(a => a.status === 'Terminado').length;
      const overdue = activities.filter(a => a.due_date && a.due_date < today && a.status !== 'Terminado').length;
      for (const [id,val] of Object.entries({total,progress,pending,done,overdue}))
        document.getElementById(id).textContent = val;

      renderBars('statusBars', 'status', ['No iniciado','En proceso','Terminado']);
      renderBars('priorityBars', 'priority', ['Baja','Media','Alta']);

      const q = document.getElementById('search').value.toLowerCase();
      const fs = document.getElementById('filterStatus').value;
      const fp = document.getElementById('filterPriority').value;

      const filtered = activities.filter(a => {
        const text = [a.title,a.projects?.name,a.areas?.name,a.assigned_to,a.status].filter(Boolean).join(' ').toLowerCase();
        return text.includes(q) && (!fs || a.status === fs) && (!fp || a.priority === fp);
      });

      const overdueClass = (a) => a.due_date && a.due_date < today && a.status !== 'Terminado' ? 'row-overdue' : '';

      document.getElementById('activityTable').innerHTML = filtered.length
        ? filtered.map(a => `
          <tr class="${overdueClass(a)}">
            <td><strong>${esc(a.title)}</strong>${a.notes ? `<br><small class="note-preview">${esc(a.notes.slice(0,60))}${a.notes.length>60?'…':''}</small>` : ''}</td>
            <td>${esc(a.projects?.name || '—')}</td>
            <td><span class="pill ${a.priority.toLowerCase()}">${a.priority}</span></td>
            <td><span class="pill status-${a.status.replace(/\s+/g,'-').toLowerCase()}">${a.status}</span></td>
            <td>${a.due_date || '—'}</td>
            <td>${esc(a.assigned_to || '—')}</td>
            <td class="row-actions">
              <button class="act-btn edit-btn" onclick="openEdit(${JSON.stringify(a).split('"').join('&quot;')})">✏️</button>
              <button class="act-btn del-btn" onclick="deleteActivity('${a.id}','${esc(a.title)}')">🗑️</button>
            </td>
          </tr>`).join('')
        : '<tr><td colspan="7" style="text-align:center;color:#9ca3af;padding:30px">Sin resultados</td></tr>';
    }

    function renderBars(elementId, field, values) {
      const el = document.getElementById(elementId);
      const colors = { 'No iniciado':'#94a3b8','En proceso':'#4d6fe8','Terminado':'#22c55e','Baja':'#22c55e','Media':'#f59e0b','Alta':'#ef4444' };
      el.innerHTML = values.map(v => {
        const n = activities.filter(a => a[field] === v).length;
        const pct = activities.length ? Math.round(n / activities.length * 100) : 0;
        return `<div class="bar-row"><div><span>${v}</span><b>${n}</b></div>
          <div class="bar"><i style="width:${pct}%;background:${colors[v]}"></i></div></div>`;
      }).join('');
    }

    ['search','filterStatus','filterPriority'].forEach(id =>
      document.getElementById(id).addEventListener('input', render));

    // Guardar nueva
    document.getElementById('activityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('formMsg');
      const btn = e.target.querySelector('button');
      msg.textContent = 'Guardando…'; btn.disabled = true;

      const projectId = await upsertRelation('projects', document.getElementById('project').value.trim());
      const areaId = await upsertRelation('areas', document.getElementById('area').value.trim());
      if (projectId === false || areaId === false) { msg.textContent = 'Error al guardar relación.'; btn.disabled = false; return; }

      const status = document.getElementById('status').value;
      const { error } = await supabaseClient.from('activities').insert({
        title: document.getElementById('activityTitle').value.trim(),
        project_id: projectId, area_id: areaId,
        assigned_to: document.getElementById('assigned').value.trim() || null,
        importance: document.getElementById('importance').value,
        priority: document.getElementById('priority').value,
        status, due_date: document.getElementById('due').value || null,
        completed_at: status === 'Terminado' ? new Date().toISOString().slice(0,10) : null,
        notes: document.getElementById('notes').value.trim() || null
      });
      btn.disabled = false;
      if (error) { msg.textContent = error.message; return; }
      e.target.reset(); msg.textContent = '✓ Actividad guardada.';
      await loadActivities();
    });

    // Editar
    function openEdit(a) {
      document.getElementById('editId').value = a.id;
      document.getElementById('eTitle').value = a.title;
      document.getElementById('eProject').value = a.projects?.name || '';
      document.getElementById('eArea').value = a.areas?.name || '';
      document.getElementById('eAssigned').value = a.assigned_to || '';
      document.getElementById('eImportance').value = a.importance;
      document.getElementById('ePriority').value = a.priority;
      document.getElementById('eStatus').value = a.status;
      document.getElementById('eDue').value = a.due_date || '';
      document.getElementById('eNotes').value = a.notes || '';
      document.getElementById('editMsg').textContent = '';
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    document.getElementById('editModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('editMsg');
      const btn = e.target.querySelector('button');
      msg.textContent = 'Guardando…'; btn.disabled = true;

      const id = document.getElementById('editId').value;
      const projectId = await upsertRelation('projects', document.getElementById('eProject').value.trim());
      const areaId = await upsertRelation('areas', document.getElementById('eArea').value.trim());

      const status = document.getElementById('eStatus').value;
      const { error } = await supabaseClient.from('activities').update({
        title: document.getElementById('eTitle').value.trim(),
        project_id: projectId || null, area_id: areaId || null,
        assigned_to: document.getElementById('eAssigned').value.trim() || null,
        importance: document.getElementById('eImportance').value,
        priority: document.getElementById('ePriority').value,
        status, due_date: document.getElementById('eDue').value || null,
        completed_at: status === 'Terminado' ? new Date().toISOString().slice(0,10) : null,
        notes: document.getElementById('eNotes').value.trim() || null
      }).eq('id', id);

      btn.disabled = false;
      if (error) { msg.textContent = error.message; return; }
      closeModal(); await loadActivities();
    });

    // Eliminar
    async function deleteActivity(id, title) {
      if (!confirm(`¿Eliminar "${title}"?`)) return;
      const { error } = await supabaseClient.from('activities').delete().eq('id', id);
      if (error) { alert(error.message); return; }
      await loadActivities();
    }

    // Upsert helper
    async function upsertRelation(table, name) {
      if (!name) return null;
      let r = await supabaseClient.from(table).select('id').eq('name', name).maybeSingle();
      if (r.data) return r.data.id;
      const ins = await supabaseClient.from(table).insert({name}).select('id').single();
      if (ins.error) return false;
      return ins.data.id;
    }

    // Export CSV
    function exportCSV() {
      const headers = ['Actividad','Proyecto','Área','Prioridad','Estado','Entrega','Asignado','Notas'];
      const rows = activities.map(a => [
        a.title, a.projects?.name||'', a.areas?.name||'',
        a.priority, a.status, a.due_date||'', a.assigned_to||'', (a.notes||'').replace(/\n/g,' ')
      ]);
      const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `actividades-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    document.getElementById('logout').addEventListener('click', signOut);

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }

    init();
  </script>
</body>
</html>
