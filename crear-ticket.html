<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Ticket</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; padding: 2rem 1rem; }
    .card {
      background: #fff; padding: 2rem;
      border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 560px; margin: 0 auto;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .header h1 { font-size: 1.3rem; color: #1a1a2e; }
    .user-info { font-size: 0.8rem; color: #6b7280; }
    .logout-btn {
      background: none; border: 1px solid #d1d5db;
      border-radius: 6px; padding: 0.3rem 0.7rem;
      font-size: 0.78rem; cursor: pointer; color: #374151;
      margin-left: 0.75rem;
    }
    .logout-btn:hover { background: #f9fafb; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 0.3rem; }
    input[type="text"], textarea, select {
      width: 100%; padding: 0.65rem 0.85rem;
      border: 1px solid #d1d5db; border-radius: 8px;
      font-size: 0.9rem; margin-bottom: 1rem;
      font-family: inherit; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: #6366f1; }
    textarea { resize: vertical; min-height: 100px; }
    button[type="submit"] {
      width: 100%; padding: 0.7rem;
      background: #6366f1; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    button[type="submit"]:disabled { background: #a5b4fc; cursor: not-allowed; }
    .success {
      display: none; background: #dcfce7; color: #15803d;
      padding: 0.7rem 0.85rem; border-radius: 8px;
      font-size: 0.85rem; margin-bottom: 1rem;
    }
    .success.visible { display: block; }
    .error {
      display: none; background: #fee2e2; color: #b91c1c;
      padding: 0.6rem 0.85rem; border-radius: 8px;
      font-size: 0.82rem; margin-bottom: 1rem;
    }
    .error.visible { display: block; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>Crear Ticket</h1>
    <div style="display:flex;align-items:center;">
      <span class="user-info" id="userEmail"></span>
      <button class="logout-btn" id="btnLogout">Cerrar sesión</button>
    </div>
  </div>

  <div class="success" id="successMsg">✓ Ticket creado correctamente.</div>
  <div class="error"   id="errorMsg"></div>

  <label for="asunto">Asunto</label>
  <input type="text" id="asunto" placeholder="Describe brevemente el problema"/>

  <div class="row">
    <div>
      <label for="categoria">Categoría</label>
      <select id="categoria">
        <option value="">Seleccionar...</option>
        <option>Hardware</option>
        <option>Software</option>
        <option>Red / Conectividad</option>
        <option>Accesos</option>
        <option>Otro</option>
      </select>
    </div>
    <div>
      <label for="prioridad">Prioridad</label>
      <select id="prioridad">
        <option value="Baja">Baja</option>
        <option value="Media" selected>Media</option>
        <option value="Alta">Alta</option>
        <option value="Urgente">Urgente</option>
      </select>
    </div>
  </div>

  <label for="descripcion">Descripción</label>
  <textarea id="descripcion" placeholder="Detalla el problema, pasos para reproducirlo, etc."></textarea>

  <button type="submit" id="btnCrear">Crear Ticket</button>
</div>

<script>
  const SUPABASE_URL = 'TU_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true }
  });

  let currentUser = null;

  // Verificar sesión al cargar
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return;
    }
    currentUser = session.user;
    document.getElementById('userEmail').textContent = currentUser.email;
  })();

  // Cerrar sesión
  document.getElementById('btnLogout').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
  });

  // Crear ticket
  document.getElementById('btnCrear').addEventListener('click', async () => {
    const asunto      = document.getElementById('asunto').value.trim();
    const descripcion = document.getElementById('descripcion').value.trim();
    const prioridad   = document.getElementById('prioridad').value;
    const categoria   = document.getElementById('categoria').value;
    const successEl   = document.getElementById('successMsg');
    const errorEl     = document.getElementById('errorMsg');
    const btnEl       = document.getElementById('btnCrear');

    successEl.classList.remove('visible');
    errorEl.classList.remove('visible');

    if (!asunto) {
      errorEl.textContent = 'El asunto es obligatorio.';
      errorEl.classList.add('visible');
      return;
    }

    btnEl.disabled = true;
    btnEl.textContent = 'Enviando...';

    const { error } = await supabase.from('tickets').insert({
      user_id:     currentUser.id,
      user_email:  currentUser.email,
      asunto,
      descripcion,
      prioridad,
      categoria
    });

    btnEl.disabled = false;
    btnEl.textContent = 'Crear Ticket';

    if (error) {
      errorEl.textContent = 'Error al crear el ticket. Intenta nuevamente.';
      errorEl.classList.add('visible');
      return;
    }

    successEl.classList.add('visible');
    document.getElementById('asunto').value = '';
    document.getElementById('descripcion').value = '';
    document.getElementById('categoria').value = '';
    document.getElementById('prioridad').value = 'Media';
  });
</script>
</body>
</html>
